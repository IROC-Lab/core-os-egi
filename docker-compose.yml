# EGI Brand (por EGI Group) · recurso "Docker Compose" NOVO no Coolify.
# NÃO use no recurso do Core OS atual (cerebro.appegi.com.br): este compose é a plataforma multi-tenant.
# Domínio (ex.: brand.appegi.com.br) apontando pro serviço egi-brand, porta 3000. Variáveis no .env.example.
services:
  egi-brand:
    build: .
    restart: unless-stopped
    depends_on: [banco]
    environment:
      # --- obrigatórias ---
      DATABASE_URL: postgres://egi_brand:${BANCO_SENHA}@banco:5432/egi_brand   # Postgres de fora: troque esta linha
      EGI_MASTER_KEY: ${EGI_MASTER_KEY}                # openssl rand -hex 32 (guarde num cofre!)
      EGI_PUBLIC_URL: ${EGI_PUBLIC_URL}                # https://brand.appegi.com.br
      EGI_ADMIN_EMAIL: ${EGI_ADMIN_EMAIL}              # primeiro admin EGI (criado só se não existir nenhum)
      EGI_ADMIN_SENHA: ${EGI_ADMIN_SENHA}
      # --- cobrança (Asaas) ---
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_AMBIENTE: ${ASAAS_AMBIENTE:-sandbox}       # sandbox | producao
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}    # o mesmo token configurado no webhook do Asaas
      EGI_DIAS_SUSPENSAO: ${EGI_DIAS_SUSPENSAO:-5}
      EGI_DIAS_LEMBRETE: ${EGI_DIAS_LEMBRETE:-3}
      EGI_SETUP_VENCIMENTO_DIAS: ${EGI_SETUP_VENCIMENTO_DIAS:-0}
      # --- canais ---
      EVO_URL: ${EVO_URL:-https://evo.appegi.com.br}
      EVO_KEY: ${EVO_KEY:-}                            # apikey global: fica SÓ na plataforma, nunca vai pras empresas
      EGI_AVISOS_EVO_INSTANCIA: ${EGI_AVISOS_EVO_INSTANCIA:-}   # instância da EGI que manda os avisos de cobrança
      EGI_SUPORTE_CONTATO: ${EGI_SUPORTE_CONTATO:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}                  # transcrição de áudio (a empresa pode usar a dela)
      # --- capacidade ---
      EGI_MAX_PARALELO: ${EGI_MAX_PARALELO:-3}         # agentes sem tela rodando ao mesmo tempo (todas as empresas)
      TZ: America/Sao_Paulo
    volumes:
      - egi-brand-dados:/data                          # /data/empresas/<slug>/ (cérebro, logins, .env) + /data/plataforma
    expose:
      - "3000"

  # Postgres DEDICADO do EGI Brand (não mexe nos bancos compartilhados da EGI).
  # Pra usar um Postgres de fora, defina DATABASE_URL e apague este serviço e o depends_on.
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: egi_brand
      POSTGRES_USER: egi_brand
      POSTGRES_PASSWORD: ${BANCO_SENHA}
    volumes:
      - egi-brand-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egi_brand -d egi_brand"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  egi-brand-dados:
  egi-brand-banco:
