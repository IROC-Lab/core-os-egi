# EGI Drive — drive.appegi.com.br
# Pasta compartilhada com senha: você sobe arquivos pelo navegador e os Core OS (Iuri e Edu)
# enxergam a mesma pasta em /drive. Os arquivos ficam no host em /opt/egi-drive.
#
# No Coolify: New Resource > Docker Compose (repositório IROC-Lab/core-os-egi),
# "Docker compose location" = /drive/docker-compose.yml, domínio https://drive.appegi.com.br (porta 80).
services:
  # deixa a pasta do host no dono certo (uid 1000 = coreos nos Core OS e o usuário do File Browser)
  drive-permissoes:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /srv && chown 1000:1000 /srv /database && chmod 750 /srv"]
    volumes:
      - /opt/egi-drive:/srv
      - drive-banco:/database

  drive:
    image: filebrowser/filebrowser:v2
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      drive-permissoes:
        condition: service_completed_successfully
    environment:
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_ADDRESS: 0.0.0.0
      FB_PORT: "80"
    volumes:
      - /opt/egi-drive:/srv              # os arquivos (mesma pasta que os Core OS montam em /drive)
      - drive-banco:/database            # usuários, senhas e preferências do File Browser
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  drive-banco:
